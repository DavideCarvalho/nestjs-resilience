name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.26.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # npm learned OIDC in 11.5.1 and the Node pinned above ships 10.x, so without this the
      # publish fails as `E404 - PUT https://registry.npmjs.org/<pkg>`: npm answers 404 rather
      # than 403 for an unauthorized package, which reads as "no such package" rather than
      # "not authenticated". Upgraded here rather than by moving the Node version, so the
      # toolchain the packages are built and tested against does not change.
      #
      # Pinned to 11.x, NOT @latest: npm 12 changed `npm info <pkg> --json` to return an array
      # where 11 returned a packument object, and changesets reads `.versions` off it — so on
      # npm 12 every package looks unpublished and it republishes live versions.
      - name: Upgrade npm for OIDC trusted publishing
        run: |
          npm install -g 'npm@^11.5.1'
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A Renovate patch/minor bump automerges on its own and brings no changeset with it, so
      # the step below would find nothing to publish and the new dependency would reach npm
      # only whenever someone next released by hand. This writes the changeset for it and
      # versions it in place, leaving the release a plain "nothing pending, publish" run.
      # Majors are merged by a person, so github.actor is not renovate[bot] and none of it runs.
      - name: Release a Renovate dependency bump
        if: github.event_name == 'push' && github.actor == 'renovate[bot]'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          cat > "$RUNNER_TEMP/renovate-release.mjs" <<'NODE'
          // Writes a patch changeset for a Renovate dependency bump, and only for one: it stays quiet
          // unless a published package's dependencies or peerDependencies actually moved, so lockfile
          // maintenance, devDependency bumps and Actions bumps do not each cut a release.
          import { execFileSync } from "node:child_process";
          import { existsSync, readdirSync, writeFileSync } from "node:fs";

          const before = process.env.BEFORE;
          const after = process.env.AFTER || "HEAD";
          const git = (...args) => execFileSync("git", args, { encoding: "utf8" });
          const skip = (why) => {
            console.log("No dependency release: " + why);
            process.exit(0);
          };

          // A changeset already waiting means a hand-written release is queued behind it. Versioning now
          // would drag that unreleased work out under a dependency bump's name.
          const pending = existsSync(".changeset")
            ? readdirSync(".changeset").filter((f) => f.endsWith(".md") && f.toLowerCase() !== "readme.md")
            : [];
          if (pending.length > 0) skip("changeset(s) already pending (" + pending.join(", ") + ")");
          if (!before || /^0+$/.test(before)) skip("no previous commit to compare against");

          const changed = git("diff", "--name-only", before + ".." + after)
            .split("\n")
            .filter((f) => f === "package.json" || f.endsWith("/package.json"));
          if (changed.length === 0) skip("no package.json changed");

          const readAt = (rev, path) => {
            try {
              return JSON.parse(git("show", rev + ":" + path));
            } catch {
              return null;
            }
          };

          const bumped = [];
          for (const path of changed) {
            const now = readAt(after, path);
            if (!now || !now.name || now.private === true) continue;
            const then = readAt(before, path) || {};
            const moved = ["dependencies", "peerDependencies"].some(
              (field) => JSON.stringify(now[field] || {}) !== JSON.stringify(then[field] || {}),
            );
            if (moved) bumped.push(now.name);
          }
          if (bumped.length === 0) skip("no published package changed a runtime dependency");

          const summary = git("log", "-1", "--pretty=%s", after).trim();
          writeFileSync(
            ".changeset/renovate-" + after.slice(0, 12) + ".md",
            ["---", ...bumped.map((name) => '"' + name + '": patch'), "---", "", summary, ""].join("\n"),
          );
          console.log("Patch release queued for " + bumped.join(", "));
          NODE
          node "$RUNNER_TEMP/renovate-release.mjs"
          if [ -z "$(git status --porcelain .changeset)" ]; then exit 0; fi
          pnpm run version
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore: version packages"
          git push origin HEAD:${{ github.ref_name }}

      # v2 is required by the @changesets/cli v3 in this repo, not a routine bump. v1 learned what
      # had been published by scraping `New tag: <pkg>@<version>` out of the CLI's stdout, and v3
      # no longer prints that line — so the regex matched nothing, and since tag pushing and
      # release creation both sit inside that loop, publishes landed on npm while the git tag and
      # GitHub Release were silently skipped and the step still exited 0. v2 reads the structured
      # NDJSON the CLI writes to $CHANGESETS_OUTPUT instead. That env var is handed to the publish
      # script, so `pnpm release` must keep reaching `changeset publish` with the environment
      # intact or the tag and Release go missing again.
      - name: Create Release Pull Request or Publish
        uses: changesets/action@v2.1.2
        with:
          publish-script: pnpm release
          # Without this the action runs a bare `changeset version`, which bumps package.json
          # but never runs scripts/sync-version.mjs, so the `export const VERSION` literal that
          # tsc bakes into dist keeps the previous release's number.
          version-script: pnpm run version
        # Deliberately no NODE_AUTH_TOKEN, and no NPM_TOKEN either: publish auth is npm trusted
        # publishing over OIDC. setup-node writes
        # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into ~/.npmrc regardless, so
        # wiring an unset secret here would leave an EMPTY credential that npm sends instead of
        # falling through to the OIDC exchange. Absent is not the same as empty.
